function safeDate(v){
 if(!v)return null;
 let s=String(v).trim(), d=new Date(s);
 if(!Number.isNaN(d.getTime())) return new Date(d.getFullYear(),d.getMonth(),d.getDate());
 let m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
 if(m){d=new Date(`${m[2]} ${m[1]}, ${m[3]}`);if(!Number.isNaN(d.getTime()))return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
 return null;
}
function getDateBounds(){
 return {start:document.getElementById('globalStart')?.value||'',end:document.getElementById('globalEnd')?.value||''};
}

function pageRows(){
 if(page==='Custom Fields') return customFieldRecords;
 let d=data[page]; return records[page]||d?.rows||[];
}
function filteredRows(rows,cols){
 let q=(document.getElementById('pageSearch')?.value||document.getElementById('globalSearch')?.value||'').trim().toLowerCase();
 let start=document.getElementById('filterStart')?.value||activeFilter.start||getDateBounds().start;
 let end=document.getElementById('filterEnd')?.value||activeFilter.end||getDateBounds().end;
 let status=document.getElementById('filterStatus')?.value||activeFilter.status||'All statuses';
 let prog=document.getElementById('filterProgramme')?.value||activeFilter.programme||'All programmes';
 let group=document.getElementById('filterGroup')?.value||activeFilter.group||'All groups';
 return rows.map((r,i)=>({r,i})).filter(({r})=>{
   if(q&&!r.join(' ').toLowerCase().includes(q))return false;
   const st=r[cols.indexOf('Status')];if(status!=='All statuses'&&status!=='All statuses'&&st&&String(st).toLowerCase()!==status.toLowerCase())return false;
   const p=r[cols.findIndex(c=>/programme/i.test(c))];if(prog!=='All programmes'&&p&&p!==prog)return false;
   const g=r[cols.findIndex(c=>/group|cohort/i.test(c))];if(group!=='All groups'&&g&&g!==group)return false;
   if(start||end){
    const dateIndexes=cols.map((c,i)=>/date|last active/i.test(c)?i:-1).filter(i=>i>=0);
    const ds=dateIndexes.map(i=>safeDate(r[i])).filter(Boolean);
    if(ds.length){let inRange=ds.some(d=>(!start||d>=new Date(start+'T00:00:00'))&&(!end||d<=new Date(end+'T23:59:59')));if(!inRange)return false;}
   }
   return true;
 });
}
function tableHtml(obj){
 const cols=obj.cols||[], all=page==='Custom Fields'?customFieldRecords:(records[page]||obj.rows||[]);
 const filtered=filteredRows(all,cols), rows=filtered.map(x=>x.r);
 if(!rows.length)return `<div class="empty"><div class="big">⌕</div><b>No matching records</b>Try changing the search terms or filters.</div>`;
 return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}${c==='Actions'?'':'　⌄'}</th>`).join('')}</tr></thead><tbody>${filtered.map(({r, i})=>`<tr>${r.map((v,ci)=>{
 let col=cols[ci]||'';
 if(['Progress','Completion Rate','Average Score','Tasks Completed','Attendance','Overall Progress'].includes(col)&&!String(v).includes('/'))return `<td>${progress(v)}</td>`;
 if(['Status','Support Status'].includes(col))return `<td>${pill(String(v))}</td>`;
 if(col==='Actions')return `<td><button class="secondary" title="Edit" onclick="editRow(${i})">✎</button> <button class="secondary" title="Delete" onclick="deleteRow(${i})">🗑</button></td>`;
 if(['Programme Name','Title','Name','Candidate Name','Candidate ID','Field Name'].includes(col))return `<td class="link" onclick="editRow(${i})">${v}</td>`;
 if(col==='Required'||col==='Visible')return `<td>${v==='On'?'<input type="checkbox" checked onchange="toggleCustomField('+i+','+ci+',this.checked)">':v==='Off'?'<input type="checkbox" onchange="toggleCustomField('+i+','+ci+',this.checked)">':v}</td>`;
 return `<td>${v??''}</td>`;
 }).join('')}${r.length<cols.length?cols.slice(r.length).map(col=>col==='Actions'?`<td><button class="secondary" title="Edit" onclick="editRow(${i})">✎</button> <button class="secondary" title="Delete" onclick="deleteRow(${i})">🗑</button></td>`:`<td></td>`).join(''):''}</tr>`).join('')}</tbody></table></div><div style="padding:10px 13px;color:var(--muted);font-size:10px">Showing ${rows.length?1:0} to ${rows.length} of ${all.length} records <span style="float:right">Filtered results</span></div>`;
}
function filters(){
 const pOpts=['All programmes',...cohortNames].map(v=>`<option ${v===(activeFilter.programme||'All programmes')?'selected':''}>${v}</option>`).join('');
 const gOpts=['All groups',...cohortNames].map(v=>`<option ${v===(activeFilter.group||'All groups')?'selected':''}>${v}</option>`).join('');
 return `<div class="filters">
 <select id="filterProgramme" aria-label="Filter programme">${pOpts}</select>
 <select id="filterGroup" aria-label="Filter cohort/group">${gOpts}</select>
 <select id="filterStatus">${['All statuses','Active','Pending','Archived','Completed','In Progress','At Risk','Needs Support'].map(v=>`<option ${v===(activeFilter.status||'All statuses')?'selected':''}>${v}</option>`).join('')}</select>
 <input type="date" id="filterStart" aria-label="Start date" value="${activeFilter.start||getDateBounds().start}">
 <input type="date" id="filterEnd" aria-label="End date" value="${activeFilter.end||getDateBounds().end}">
 <input type="search" id="pageSearch" placeholder="⌕ Search ${page.toLowerCase()}..." value="${(document.getElementById('globalSearch')?.value||'').replace(/"/g,'&quot;')}">
 <button class="secondary" onclick="applyFilters()">⚑ Filter</button><button class="secondary" onclick="clearFilters()">Clear</button><button class="secondary" onclick="exportCsv()">⇩ Export</button>
 </div>`;
}
function applyFilters(){activeFilter={query:document.getElementById('pageSearch')?.value||'',status:document.getElementById('filterStatus')?.value||'All statuses',programme:document.getElementById('filterProgramme')?.value||'All programmes',group:document.getElementById('filterGroup')?.value||'All groups',start:document.getElementById('filterStart')?.value||'',end:document.getElementById('filterEnd')?.value||''};render();}
function clearFilters(){document.getElementById('globalSearch').value='';const a=document.getElementById('globalStart'),b=document.getElementById('globalEnd');if(a)a.value='';if(b)b.value='';activeFilter={query:'',status:'All statuses',programme:'All programmes',group:'All groups',start:'',end:''};render();}
function listPage(){
 let d=data[page], stats=d.stats?statCards(d.stats):'';
 return `<div class="heading"><div><h1>${page}</h1><div class="subtitle">${d.desc}</div></div><button class="primary" onclick="openCreate()">＋ ${({'Programmes':'Create Programme','Groups':'Create Group','Users (Staff)':'Add Staff Member','Candidates':'Add Candidate','Assignments':'Create Assignment','Attendance':'Record Attendance','Assessments':'Create Assessment','Quizzes':'Create Quiz'})[page]||'Create New'}</button></div>${stats}<div class="panel">${filters()}<div class="tabs"><button class="tab active" onclick="setStatusTab('All statuses')">All ${page}</button><button class="tab" onclick="setStatusTab('Active')">Active</button><button class="tab" onclick="setStatusTab('Upcoming')">Upcoming</button><button class="tab" onclick="setStatusTab('Archived')">Archived / Completed</button></div>${tableHtml(d)}</div>`;
}
function setStatusTab(s){const el=document.getElementById('filterStatus');if(el){el.value=s==='Upcoming'?'All statuses':s;applyFilters();}}
function customFields(){
 const rows=customFieldRecords;
 return `<div class="heading"><div><h1>Custom Fields</h1><div class="subtitle">Define and manage additional information fields for candidates.</div></div></div>
 ${statCards([['♧','Total Fields',rows.length,'Across all cohorts','blue'],['☑','Active Fields',rows.filter(r=>r[5]==='Active').length,'Ready for use','green'],['◉','Inactive Fields',rows.filter(r=>r[5]==='Inactive').length,'Hidden from forms','purple'],['▣','Field Types',new Set(rows.map(r=>r[1])).size,'Different types','orange']])}
 <div class="settingsgrid" style="grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)">
 <div><div class="panel"><div class="tabs" id="fieldTabs"><button class="tab active" onclick="fieldCategory('All Fields',this)">All Fields</button><button class="tab" onclick="fieldCategory('Personal Info',this)">Personal Info</button><button class="tab" onclick="fieldCategory('Academic',this)">Academic</button><button class="tab" onclick="fieldCategory('Skills & Interests',this)">Skills & Interests</button><button class="tab" onclick="fieldCategory('Additional Info',this)">Additional Info</button></div><div class="filters"><input type="search" id="pageSearch" placeholder="⌕ Search fields..." oninput="renderCustomTable()"><button class="secondary" onclick="exportCsv()">⇩ Export</button></div><div id="customTable">${tableHtml({cols:['Field Name','Type','Category','Required','Visible','Status','Actions']})}</div></div>
 <div class="note" style="display:${cfHelpVisible?'block':'none'};position:relative" id="fieldHelp"><button class="xbtn" style="position:absolute;right:8px;top:4px" onclick="cfHelpVisible=false;render()">×</button><b>ⓘ How Custom Fields Work</b><p>Custom fields let you capture additional information about your candidates, such as skills, interests or qualifications.</p></div></div>
 <div class="panel"><div class="panel-head">Create New Field</div><div class="panel-body"><div class="field"><label>Field Name *</label><input id="fieldName" placeholder="e.g. Portfolio Website" required></div><div class="field"><label>Field Type *</label><select id="fieldType"><option value="">Select field type</option><option>Text</option><option>Dropdown</option><option>Date</option><option>URL</option><option>Multiple Choice</option><option>Number</option><option>Checkbox</option></select></div><div class="field"><label>Category</label><select id="fieldCategory"><option>Personal Info</option><option>Academic</option><option>Skills & Interests</option><option>Additional Info</option></select></div><div class="field"><label>Description (optional)</label><textarea id="fieldDescription" placeholder="Add a short description..."></textarea></div><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="fieldRequired"> Required Field</label><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="fieldVisible" checked> Visible to Candidates</label><button class="primary" onclick="createCustomField()">＋ Create Field</button></div></div></div>`;
}
let currentFieldCategory='All Fields';
function renderCustomTable(){
 const q=(document.getElementById('pageSearch')?.value||'').toLowerCase(), cols=['Field Name','Type','Category','Required','Visible','Status','Actions'];
 const list=customFieldRecords.map((r,i)=>({r,i})).filter(({r})=>(currentFieldCategory==='All Fields'||r[2]===currentFieldCategory)&&r.join(' ').toLowerCase().includes(q));
 const root=document.getElementById('customTable');if(!root)return;
 root.innerHTML=`<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${list.map(({r,i})=>`<tr>${r.map((v,ci)=>`<td>${ci===3||ci===4?`<input type="checkbox" ${v==='Yes'||v==='On'?'checked':''} onchange="toggleCustomField(${i},${ci},this.checked)">`:v}</td>`).join('')}<td><button class="secondary" onclick="editCustomField(${i})">✎</button> <button class="secondary" onclick="deleteCustomField(${i})">🗑</button></td></tr>`).join('')}</tbody></table></div><div style="padding:10px;color:var(--muted)">Showing ${list.length} of ${customFieldRecords.length} fields</div>`;
}
function fieldCategory(cat,btn){currentFieldCategory=cat;document.querySelectorAll('#fieldTabs .tab').forEach(x=>x.classList.toggle('active',x===btn));renderCustomTable();}
function createCustomField(){
 const name=document.getElementById('fieldName').value.trim(),type=document.getElementById('fieldType').value,cat=document.getElementById('fieldCategory').value;
 if(!name||!type){toast('Enter a field name and type');return;}
 if(customFieldRecords.some(r=>r[0].toLowerCase()===name.toLowerCase())){toast('A field with that name already exists');return;}
 customFieldRecords.push([name,type,cat,document.getElementById('fieldRequired').checked?'Yes':'No',document.getElementById('fieldVisible').checked?'On':'Off','Active']);
 persistRecords();render();toast('Custom field created');
}
function toggleCustomField(i,col,checked){if(!customFieldRecords[i])return;customFieldRecords[i][col]=col===3?(checked?'Yes':'No'):(checked?'On':'Off');persistRecords();render();}
function deleteCustomField(i){if(!customFieldRecords[i])return;if(!confirm('Delete this custom field?'))return;customFieldRecords.splice(i,1);persistRecords();render();toast('Custom field deleted');}
function editCustomField(i){const r=customFieldRecords[i];if(!r)return;document.getElementById('modalTitle').textContent='Edit Custom Field';document.getElementById('modalBody').innerHTML=r.slice(0,3).map((v,j)=>`<div class="field"><label>${['Field Name','Type','Category'][j]}</label><input value="${String(v).replace(/"/g,'&quot;')}"></div>`).join('')+`<div class="field"><label>Status</label><select><option ${r[5]==='Active'?'selected':''}>Active</option><option ${r[5]==='Inactive'?'selected':''}>Inactive</option></select></div>`;document.getElementById('modalback').classList.add('show');document.getElementById('saveRecord').onclick=()=>{const f=[...document.querySelectorAll('#modalBody input')].map(x=>x.value);r[0]=f[0];r[1]=f[1];r[2]=f[2];r[5]=document.querySelector('#modalBody select').value;persistRecords();closeModal();render();toast('Field updated');};}
function deleteRow(i){let rows=pageRows();if(!rows[i])return;if(!confirm(`Delete this ${page.toLowerCase()} record? This cannot be undone.`))return;if(page==='Custom Fields')customFieldRecords.splice(i,1);else{if(!records[page])records[page]=[...data[page].rows];records[page].splice(i,1);}persistRecords();render();toast('Record deleted');}
function editRow(i){if(page==='Custom Fields'){editCustomField(i);return;}let rows=pageRows(),row=rows[i];if(!row)return;document.getElementById('modalTitle').textContent='Edit '+page.replace(/\(Staff\)/,'Staff');document.getElementById('modalBody').innerHTML=row.map((v,j)=>`<div class="field"><label>${(data[page]?.cols||[])[j]||'Field '+(j+1)}</label><input value="${String(v??'').replace(/"/g,'&quot;')}"></div>`).join('');document.getElementById('modalback').classList.add('show');document.getElementById('saveRecord').onclick=()=>{let vals=[...document.querySelectorAll('#modalBody input')].map(x=>x.value);if(!records[page])records[page]=[...data[page].rows];records[page][i]=vals;persistRecords();closeModal();render();toast('Changes saved');};}
function saveRecord(){
 const fields=[...document.querySelectorAll('#modalBody input,#modalBody select,#modalBody textarea')], vals=fields.map(f=>f.value.trim());
 if(!vals.some(Boolean)){toast('Please enter record details');return;}
 if(data[currentModal]){if(!records[currentModal])records[currentModal]=[...data[currentModal].rows];let cols=data[currentModal].cols;let row=cols.map((c,i)=>{if(i===0)return vals[0]||'New record';let match=fields.find(f=>f.previousElementSibling?.textContent===c);return match?.value|| (c==='Status'?'Active':'—');});records[currentModal].unshift(row);}
 persistRecords();closeModal();render();toast('Record saved successfully');
}
function render(){
 const el=document.getElementById('main');
 if(page==='Dashboard')el.innerHTML=dashboard();
 else if(data[page])el.innerHTML=listPage();
 else if(page==='Reports')el.innerHTML=reports();
 else if(page==='Chat')el.innerHTML=chat();
 else if(page==='Custom Fields')el.innerHTML=customFields();
 else if(page==='Settings')el.innerHTML=settings();
 else if(page==='Staff Permissions')el.innerHTML=permissions();
 else el.innerHTML=candidatesPerformance();
 if(page==='Custom Fields')renderCustomTable();
 const s=document.getElementById('pageSearch');if(s&&page!=='Custom Fields')s.oninput=()=>{let q=s.value.toLowerCase();document.querySelectorAll('#main tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')};
 document.querySelectorAll('.tab').forEach(t=>{if(!t.onclick)t.onclick=()=>{t.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');toast(t.textContent+' selected')}});
}
function go(p){page=p;buildNav();render();}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;document.body.classList.remove('dark','warm');if(theme!=='light')document.body.classList.add(theme);document.querySelectorAll('.themebtn').forEach(x=>x.classList.toggle('sel',x===b))});
document.getElementById('collapse').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
document.getElementById('globalSearch').oninput=e=>{const q=e.target.value.trim();render();const s=document.getElementById('pageSearch');if(s){s.value=q;s.dispatchEvent(new Event('input'));}if(page==='Custom Fields')renderCustomTable();};
['globalStart','globalEnd'].forEach(id=>document.getElementById(id)?.addEventListener('change',()=>render()));
buildNav();render();

</script></body></html>
